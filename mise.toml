[tasks.build]
description = "Build SaveBollywood.saver into ./build/Release"
run = 'xcodebuild -project SaveBollywood.xcodeproj -target SaveBollywood -configuration Release SYMROOT="$PWD/build" OBJROOT="$PWD/build/obj" build'

[tasks.install]
description = "Build, then copy the saver into ~/Library/Screen Savers"
depends = ["build"]
run = [
  'rm -rf "$HOME/Library/Screen Savers/SaveBollywood.saver"',
  'ditto build/Release/SaveBollywood.saver "$HOME/Library/Screen Savers/SaveBollywood.saver"',
  'killall legacyScreenSaver 2>/dev/null || true',
  # System Settings gets the saver list and thumbnails from this extension. It caches the thumbnails on disk
  # and never refreshes them, so clear its cache (macOS regenerates it) and restart it
  'rm -rf "$(getconf DARWIN_USER_CACHE_DIR)com.apple.wallpaper.extension.legacy/com.apple.wallpaper.legacy.thumbnails"',
  'killall WallpaperLegacyExtension 2>/dev/null || true',
]
